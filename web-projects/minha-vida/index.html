<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Currículo vivo em um pergaminho horizontal com memórias, experiências, fotos e linha do tempo por ano."><title>Minha Vida — Rakino</title><style>
:root{color-scheme:dark;--ink:#f5e7c5;--muted:#b9a985;--gold:#c9a45b;--bg:#15100b;--paper:#ead9ac;--paperink:#342719}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#332216,#100d09 68%);color:var(--ink);font:16px/1.55 Georgia,serif;min-height:100vh}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:1rem;padding:.8rem clamp(1rem,4vw,3rem);background:#120e0beF;border-bottom:1px solid #8e6e37;backdrop-filter:blur(12px)}header a{color:var(--gold);text-decoration:none}header h1{font-size:1.15rem;margin:0}header .grow{flex:1}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #997b47;background:#24190f;color:var(--ink);padding:.55rem .85rem;border-radius:9px}button:hover{background:#49331b}main{padding:clamp(1rem,3vw,2.5rem)}.intro{max-width:1100px;margin:0 auto 1.5rem}.intro p{color:var(--muted);margin:.25rem 0}.hint{font: .8rem/1.4 system-ui;color:#ad9a76}.viewport{position:relative;max-width:1500px;margin:auto;overflow-x:auto;overflow-y:hidden;scrollbar-color:#96733d #21170f;cursor:grab;touch-action:pan-x;overscroll-behavior-x:contain;scroll-behavior:smooth;border:1px solid #8e6b37;border-radius:12px;background:#20170f;padding:20px 0 25px}.viewport.dragging{cursor:grabbing;scroll-behavior:auto;user-select:none}.scrollrow{display:flex;align-items:stretch;gap:22px;width:max-content;min-height:390px;padding:0 5vw}.scrollrow:before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,transparent,#b88a42 5%,#b88a42 95%,transparent);pointer-events:none}.year{position:relative;width:260px;min-height:350px;display:flex;flex-direction:column;gap:12px}.year h2{position:relative;z-index:1;align-self:center;margin:0;padding:5px 18px;border:1px solid #b58c4c;border-radius:30px;background:#342416;color:#f1d69b;font-size:1.15rem}.post{position:relative;z-index:1;background:linear-gradient(145deg,#f2e5c4,#d7bd88);color:var(--paperink);border:1px solid #a98a51;border-radius:3px;padding:13px;box-shadow:0 8px 20px #0007;transform:rotate(-.4deg)}.post:nth-child(even){transform:rotate(.5deg)}.post img{display:block;width:100%;max-height:170px;object-fit:cover;margin-bottom:8px;border:4px solid #f8edcf}.post h3{margin:0 0 5px;font-size:1.05rem}.post p{white-space:pre-wrap;margin:0;font-size:.95rem}.post time{display:block;margin-top:8px;font: .72rem system-ui;color:#6d5736}.admin-tools{display:flex;gap:6px;margin-top:10px}.admin-tools button{color:#342719;background:#e1c994;border-color:#987643;padding:.3rem .55rem;font: .78rem system-ui}.timeline{max-width:1500px;margin:15px auto 0;display:flex;gap:8px;overflow:auto;padding:8px 0}.timeline button{white-space:nowrap;font: .82rem system-ui}.timeline button.active{background:#755126;border-color:#d4ad63}.empty{color:#bca77d;text-align:center;padding:3rem}.dialog{position:fixed;inset:0;z-index:10;background:#000b;display:none;place-items:center;padding:1rem}.dialog.open{display:grid}.dialog form{width:min(520px,100%);max-height:90vh;overflow:auto;background:#21170f;border:1px solid #a47d3e;border-radius:14px;padding:20px;display:grid;gap:10px}.dialog label{display:grid;gap:4px;color:#dfc99a}.dialog input,.dialog textarea{width:100%;padding:9px;border:1px solid #725832;border-radius:7px;background:#120e0a;color:#fff}.dialog textarea{min-height:120px}.actions{display:flex;gap:8px;justify-content:flex-end}.notice{color:#d8bb7e;font: .85rem system-ui}@media(max-width:600px){.year{width:78vw;max-width:300px}.scrollrow{min-height:360px}.viewport{padding-top:15px}.post img{max-height:145px}}@media(prefers-reduced-motion:reduce){.viewport{scroll-behavior:auto}}
</style></head><body><header><a href="../../index.html#/web">← Rakino</a><h1>📜 Minha Vida</h1><span class="grow"></span><span id="authState" class="hint">Carregando…</span><button id="add" hidden>+ Nova postagem</button></header><main><section class="intro"><h2>Uma história em construção</h2><p>Memórias, experiências e momentos organizados ao longo dos anos.</p><p class="hint">Role a roda do mouse para navegar na horizontal · Arraste para os lados · Teclas A/D e ←/→ também funcionam.</p></section><div id="viewport" class="viewport" tabindex="0" aria-label="Pergaminho horizontal"><div id="scrollrow" class="scrollrow"><div class="empty">Carregando memórias…</div></div></div><nav id="timeline" class="timeline" aria-label="Navegar por ano"></nav><p id="status" class="notice" role="status"></p></main><div id="dialog" class="dialog"><form id="postForm"><h2 id="formTitle">Nova postagem</h2><input name="id" type="hidden"><label>Ano<input name="year" type="number" min="1900" max="2200" required></label><label>Data<input name="date" type="date"></label><label>Título<input name="title" maxlength="120" required></label><label>Texto<textarea name="text" maxlength="5000" required></textarea></label><label>URL da foto (opcional)<input name="image" type="url" placeholder="https://…"></label><div class="actions"><button type="button" id="cancel">Cancelar</button><button type="submit">Salvar</button></div></form></div><script type="module">
import * as Auth from '../../assets/js/auth.js';
const ADMIN='rakifernn@gmail.com',row=document.querySelector('#scrollrow'),viewport=document.querySelector('#viewport'),timeline=document.querySelector('#timeline'),add=document.querySelector('#add'),state=document.querySelector('#authState'),dialog=document.querySelector('#dialog'),form=document.querySelector('#postForm'),status=document.querySelector('#status');let dbx=null,fs=null,user=null,posts=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const admin=()=>user?.email?.toLowerCase()===ADMIN;const coll=()=>fs.collection(dbx,'lifePosts');
function draw(){const years=[...new Set(posts.map(p=>Number(p.year)).filter(Number.isFinite))].sort((a,b)=>a-b);if(!years.length){row.innerHTML='<div class="empty">Ainda não há postagens. As memórias aparecerão aqui.</div>';timeline.innerHTML='';return}row.innerHTML=years.map(y=>`<section class="year" id="year-${y}"><h2>${y}</h2>${posts.filter(p=>Number(p.year)===y).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))).map(p=>`<article class="post"><h3>${esc(p.title||'Memória')}</h3>${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title||'Foto da postagem')}" loading="lazy" referrerpolicy="no-referrer">`:''}<p>${esc(p.text||'')}</p>${p.date?`<time>${esc(p.date)}</time>`:''}${admin()?`<div class="admin-tools"><button data-edit="${esc(p.id)}">Editar</button><button data-delete="${esc(p.id)}">Remover</button></div>`:''}</article>`).join('')}</section>`).join('');timeline.innerHTML=years.map(y=>`<button data-year="${y}">${y}</button>`).join('')}
async function load(){if(!dbx){draw();return}try{const snap=await fs.getDocs(coll());posts=snap.docs.map(d=>({id:d.id,...d.data()}));posts.sort((a,b)=>Number(a.year)-Number(b.year));draw()}catch(e){status.textContent='Não foi possível ler a timeline do Firebase. Confira as regras do Firestore.';console.warn(e);draw()}}
function edit(p={}){form.reset();form.elements.id.value=p.id||'';form.elements.year.value=p.year||new Date().getFullYear();form.elements.date.value=p.date||'';form.elements.title.value=p.title||'';form.elements.text.value=p.text||'';form.elements.image.value=p.image||'';document.querySelector('#formTitle').textContent=p.id?'Editar postagem':'Nova postagem';dialog.classList.add('open')}
add.onclick=()=>edit();document.querySelector('#cancel').onclick=()=>dialog.classList.remove('open');dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.classList.remove('open')});
form.onsubmit=async e=>{e.preventDefault();if(!admin())return;const fd=new FormData(form),id=fd.get('id')||crypto.randomUUID();const data={year:Number(fd.get('year')),date:String(fd.get('date')),title:String(fd.get('title')).trim(),text:String(fd.get('text')).trim(),image:String(fd.get('image')).trim(),updatedAt:fs.serverTimestamp()};try{await fs.setDoc(fs.doc(coll(),id),data,{merge:true});dialog.classList.remove('open');await load();status.textContent='Postagem salva.'}catch(err){status.textContent='Falha ao salvar. Verifique login, regras e conexão.';console.error(err)}};
row.addEventListener('click',async e=>{const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(ed)edit(posts.find(p=>p.id===ed.dataset.edit));if(del&&admin()&&confirm('Remover esta postagem?')){try{await fs.deleteDoc(fs.doc(coll(),del.dataset.delete));await load()}catch(e){status.textContent='Falha ao remover postagem.'}}});timeline.onclick=e=>{const b=e.target.closest('[data-year]');if(!b)return;document.querySelector('#year-'+b.dataset.year)?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'start'});timeline.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))};
viewport.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();viewport.scrollLeft+=e.deltaY}},{passive:false});let down=false,x0=0,left=0;viewport.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;down=true;x0=e.clientX;left=viewport.scrollLeft;viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(down)viewport.scrollLeft=left-(e.clientX-x0)});const stop=()=>{down=false;viewport.classList.remove('dragging')};viewport.addEventListener('pointerup',stop);viewport.addEventListener('pointercancel',stop);viewport.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();viewport.scrollBy({left:-Math.max(240,viewport.clientWidth*.65),behavior:'smooth'})}if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();viewport.scrollBy({left:Math.max(240,viewport.clientWidth*.65),behavior:'smooth'})}});
await Auth.init();const {db,fs:f}=Auth.ctx();dbx=db;fs=f;Auth.onUser(async u=>{user=u;state.textContent=u?(admin()?'Administrador conectado':'Conectado'):'Visualização pública';add.hidden=!admin();await load()});await load();
</script></body></html>
