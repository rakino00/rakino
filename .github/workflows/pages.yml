# Publica o site no GitHub Pages a cada push na branch main.
# Só as pastas do site vão para o ar (docs/, tools/ e _legado-php/ ficam de fora).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar lista de Web Projects
        run: python tools/gerar_manifest.py
      - uses: actions/configure-pages@v5
      - name: Montar pasta pública
        run: |
          mkdir _site
          cp -r index.html 404.html sw.js manifest.webmanifest .nojekyll assets data web-projects _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
