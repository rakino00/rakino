<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Raki — Sandbox 3D</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#05080d;color:#eafaff;font-family:system-ui,Arial}canvas{display:block}.hud{position:fixed;inset:14px;z-index:5;pointer-events:none;display:flex;justify-content:space-between;gap:12px}.panel{pointer-events:auto;background:#07111bd9;border:1px solid #ffffff20;border-radius:14px;padding:12px 14px;backdrop-filter:blur(12px);box-shadow:0 14px 40px #0006}.panel h1{font-size:1rem;margin:0 0 5px}.panel p{font-size:.76rem;line-height:1.45;color:#a9b8c9;margin:0}.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.key{padding:4px 7px;border:1px solid #ffffff20;border-radius:7px;background:#101a27;font:700 11px monospace}.actions{display:flex;gap:7px;margin-top:9px}.btn{border:1px solid #ffffff22;background:#111a28;color:#eafaff;border-radius:9px;padding:8px 10px;cursor:pointer;font-weight:700}.btn.active{border-color:#22d3ee;background:#08323b}.status{margin-top:7px;color:#22d3ee;font-size:.72rem}.rakino-home{position:fixed;left:14px;bottom:14px;z-index:8;display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1px solid #ffffff20;border-radius:999px;background:#07111ddd;color:#eafaff;text-decoration:none;font-size:12px;font-weight:800}.cross{position:fixed;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%);border:1px solid #22d3ee;border-radius:50%;opacity:.8;pointer-events:none}
</style></head><body><div class="hud"><div class="panel"><h1>Raki · Sandbox 3D</h1><p>Um personagem/bloco mínimo para aprender movimentação, teleporte e câmera livre.</p><div class="keys"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span><span class="key">ESPAÇO</span><span class="key">SHIFT</span><span class="key">RMB + MOVER</span></div><div class="status" id="status">Representação: bloco</div></div><div class="panel"><p><b>Representação</b></p><div class="actions"><button class="btn active" data-mode="block">Bloco</button><button class="btn" data-mode="sprite">Spritesheet</button><button class="btn" data-mode="glb">.glb</button></div></div></div><div class="cross"></div><a class="rakino-home" href="../index.html#/home">← Início</a>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';
const status=document.querySelector('#status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x07111b);scene.fog=new THREE.Fog(0x07111b,18,90);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,120);camera.position.set(5,4.5,7);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc9eaff,0x101522,1.8));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(8,14,8);sun.castShadow=true;scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x18212d,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(80,40,0x22d3ee,0x223244);grid.material.opacity=.22;grid.material.transparent=true;scene.add(grid);
for(let i=-6;i<=6;i++){const pillar=new THREE.Mesh(new THREE.BoxGeometry(.35,2.5,.35),new THREE.MeshStandardMaterial({color:0x7c3aed,emissive:0x24083f}));pillar.position.set(i*5,1.25,-12);scene.add(pillar)}
const player=new THREE.Group();player.position.set(0,.5,0);scene.add(player);let visual=null,mode='block';let spriteFrame=0,spriteClock=0;
function clearVisual(){if(visual){player.remove(visual);visual.traverse?.(o=>{if(o.geometry)o.geometry.dispose?.();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose?.());else o.material.dispose?.()}})}visual=null}
function makeBlock(){clearVisual();const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0x22d3ee,metalness:.25,roughness:.35}));m.castShadow=true;m.position.y=0;visual=m;player.add(m);status.textContent='Representação: bloco 1×1×1';}
const loader=new THREE.TextureLoader();function makeSprite(){clearVisual();const tex=loader.load('./assets/sprites/player/player.png');tex.colorSpace=THREE.SRGBColorSpace;tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.NearestFilter;tex.wrapS=THREE.ClampToEdgeWrapping;tex.wrapT=THREE.ClampToEdgeWrapping;tex.repeat.set(.25,1);tex.offset.set(0,0);const mat=new THREE.SpriteMaterial({map:tex,transparent:true});const s=new THREE.Sprite(mat);s.scale.set(2.2,3.3,1);s.position.y=1.15;visual=s;visual.userData.sheet=tex;player.add(s);status.textContent='Representação: spritesheet 4 quadros em 3D';}
function makeGLB(){clearVisual();status.textContent='Representação: carregando assets/models/player.glb…';loaderGLTF.load('./assets/models/player.glb',g=>{visual=g.scene;visual.scale.setScalar(1);visual.position.y=0;visual.traverse(o=>{if(o.isMesh)o.castShadow=true});player.add(visual);status.textContent='Representação: .glb local';},undefined,()=>{makeBlock();status.textContent='GLB não encontrado — usando bloco como fallback. Coloque seu arquivo em Raki/assets/models/player.glb';});}
const loaderGLTF=new GLTFLoader();function setMode(next){mode=next;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===next));if(next==='block')makeBlock();if(next==='sprite')makeSprite();if(next==='glb')makeGLB();}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));makeBlock();
const keys={w:false,a:false,s:false,d:false};const velocity=new THREE.Vector3();const speed=5.2;const teleportDistance=3;function direction(){const x=(keys.d?1:0)-(keys.a?1:0),z=(keys.s?1:0)-(keys.w?1:0);const v=new THREE.Vector3(x,0,z);return v.lengthSq()?v.normalize():v}
addEventListener('keydown',e=>{if(e.code==='KeyW')keys.w=true;if(e.code==='KeyA')keys.a=true;if(e.code==='KeyS')keys.s=true;if(e.code==='KeyD')keys.d=true;if(e.code==='Space'){e.preventDefault();if(player.position.y<=.51)velocity.y=7}if(e.code==='ShiftLeft'||e.code==='ShiftRight'){const d=direction();if(d.lengthSq())player.position.addScaledVector(d,teleportDistance)}});addEventListener('keyup',e=>{if(e.code==='KeyW')keys.w=false;if(e.code==='KeyA')keys.a=false;if(e.code==='KeyS')keys.s=false;if(e.code==='KeyD')keys.d=false});
let orbiting=false,lastX=0,lastY=0,az=0.7,el=.35,rad=7.5;renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());renderer.domElement.addEventListener('pointerdown',e=>{if(e.button===2){orbiting=true;lastX=e.clientX;lastY=e.clientY}});addEventListener('pointermove',e=>{if(!orbiting)return;az-=(e.clientX-lastX)*.006;el=THREE.MathUtils.clamp(el+(e.clientY-lastY)*.004,-.9,1.15);lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',e=>{if(e.button===2)orbiting=false});
let last=performance.now();function loop(now){const dt=Math.min(.035,(now-last)/1000);last=now;const d=direction();velocity.x+=(d.x*speed-velocity.x)*Math.min(1,dt*10);velocity.z+=(d.z*speed-velocity.z)*Math.min(1,dt*10);if(!d.lengthSq()){velocity.x*=Math.max(0,1-dt*12);velocity.z*=Math.max(0,1-dt*12)}velocity.y-=18*dt;player.position.addScaledVector(velocity,dt);if(player.position.y<.5){player.position.y=.5;velocity.y=0}player.position.x=THREE.MathUtils.clamp(player.position.x,-32,32);player.position.z=THREE.MathUtils.clamp(player.position.z,-32,32);if(mode==='sprite'&&visual?.userData.sheet){spriteClock+=dt;if(spriteClock>.12){spriteClock=0;spriteFrame=(spriteFrame+1)%4;visual.userData.sheet.offset.x=spriteFrame*.25}}const cp=Math.cos(el);camera.position.set(player.position.x+Math.sin(az)*cp*rad,player.position.y+2.2+Math.sin(el)*rad,player.position.z+Math.cos(az)*cp*rad);camera.lookAt(player.position.x,player.position.y+.7,player.position.z);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
