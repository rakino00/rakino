name: Publicar Rakino no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Gerar manifest dos Web Projects
        run: python3 tools/gerar_manifest.py

      - name: Validar JavaScript
        shell: bash
        run: |
          set -e
          for f in assets/js/*.js sw.js; do
            node --check "$f"
          done

      - name: Validar JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('data/web-projects.json'), Path('web-projects/_meta.json'), Path('manifest.webmanifest')]:
              json.loads(path.read_text(encoding='utf-8'))
              print('OK:', path)
          PY

      - name: Montar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
